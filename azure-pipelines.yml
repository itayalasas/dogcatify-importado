trigger:
  - main   # o la rama que uses

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-androide

variables:
  # 🔐 Grupo de variables con los secretos del keystore
  - group: android-signing          # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

  # Versión de Node
  - name: NODE_VERSION
    value: '18.x'

  # 🔢 versionCode incremental (2, 3, 4, ...)
  # Como ya usaste el 1 en Google Play, arrancamos en 2
  - name: ANDROID_VERSION_CODE
    value: $[counter('android_version', 2)]

  # 📛 versionName: puedes cambiar el formato si quieres
  - name: ANDROID_VERSION_NAME
    value: '1.0.$(Build.BuildId)'

steps:
  # 1. Instalar Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Instalar Node.js'

  # 2. Instalar dependencias del proyecto
  - script: |
      npm install
    displayName: 'Instalar dependencias (npm install)'

  # 3. Actualizar versionCode/version en app.json ANTES del prebuild
  - script: |
      echo "Actualizando app.json con versionCode=$(ANDROID_VERSION_CODE) y version=$(ANDROID_VERSION_NAME)"

      node - << 'EOF'
      const fs = require('fs');
      const path = './app.json';

      const code = parseInt(process.env.ANDROID_VERSION_CODE, 10);
      const name = process.env.ANDROID_VERSION_NAME;

      const json = JSON.parse(fs.readFileSync(path, 'utf8'));

      if (!json.expo) json.expo = {};
      if (!json.expo.android) json.expo.android = {};

      json.expo.android.versionCode = code;
      json.expo.version = name;

      fs.writeFileSync(path, JSON.stringify(json, null, 2));
      console.log(`✅ app.json actualizado -> android.versionCode=${code}, version=${name}`);
      EOF
    displayName: 'Actualizar versionCode / version en app.json'
    env:
      ANDROID_VERSION_CODE: $(ANDROID_VERSION_CODE)
      ANDROID_VERSION_NAME: $(ANDROID_VERSION_NAME)

  # 4. Generar código nativo de Android (Expo prebuild)
  - script: |
      npx expo prebuild --platform android --non-interactive
    displayName: 'Expo prebuild Android'

  # 5. Dar permisos de ejecución a gradlew
  - script: |
      chmod +x android/gradlew
    displayName: 'Dar permisos a gradlew'

  # 6. Descargar el keystore desde Secure Files
  - task: DownloadSecureFile@1
    name: downloadKeystore
    inputs:
      secureFile: 'dogcatify-release.jks'   # 👈 nombre EXACTO en Secure Files
    displayName: 'Descargar keystore desde Secure Files'

  # 7. Copiar el keystore a una carpeta conocida dentro del agente
  - script: |
      echo "System.DefaultWorkingDirectory = $SYSTEM_DEFAULTWORKINGDIRECTORY"
      echo "Keystore descargado en        = $DOWNLOAD_KEYSTORE_PATH"

      mkdir -p "$SYSTEM_DEFAULTWORKINGDIRECTORY/android_keystore"
      cp "$DOWNLOAD_KEYSTORE_PATH" "$SYSTEM_DEFAULTWORKINGDIRECTORY/android_keystore/release.jks"

      ls -l "$SYSTEM_DEFAULTWORKINGDIRECTORY/android_keystore"
    displayName: 'Copiar keystore para el build'
    env:
      SYSTEM_DEFAULTWORKINGDIRECTORY: $(System.DefaultWorkingDirectory)
      DOWNLOAD_KEYSTORE_PATH: $(downloadKeystore.secureFilePath)

  # 8. Construir AAB firmado
  - script: |
      cd android
      ./gradlew bundleRelease
    displayName: 'Construir Android App Bundle (bundleRelease)'
    env:
      ANDROID_HOME: /home/azureuser/android-sdk
      ANDROID_SDK_ROOT: /home/azureuser/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_KEYSTORE_PATH: '$(System.DefaultWorkingDirectory)/android_keystore/release.jks'
      ANDROID_KEYSTORE_PASSWORD: '$(ANDROID_KEYSTORE_PASSWORD)'
      ANDROID_KEY_ALIAS: '$(ANDROID_KEY_ALIAS)'
      ANDROID_KEY_PASSWORD: '$(ANDROID_KEY_PASSWORD)'

  # 9. Publicar el artefacto (AAB)
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: 'android/app/build/outputs/bundle/release'
      artifactName: 'android-app'
      publishLocation: 'Container'
    displayName: 'Publicar artefacto Android'
