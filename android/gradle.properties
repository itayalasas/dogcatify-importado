# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override
# any settings specified in this file.

# ============================================================
# GRADLE PERFORMANCE
# ============================================================

# Memoria máxima disponible para Gradle.
# Mantener en 3 GB si el agente tiene entre 8 y 12 GB de RAM.
# Puedes subirlo a 4g o 6g si el agente tiene suficiente memoria.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Mantener activo el daemon para reutilizar la JVM entre compilaciones.
org.gradle.daemon=true

# Permite ejecutar tareas independientes en paralelo.
org.gradle.parallel=true

# Reutiliza resultados de compilaciones anteriores.
org.gradle.caching=true

# Limita la cantidad de workers para evitar saturar agentes pequeños.
# Ajustar de acuerdo con los CPU disponibles en el agente.
org.gradle.workers.max=4

# Kotlin incremental build.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# ============================================================
# ANDROID
# ============================================================

android.useAndroidX=true

# Enable AAPT2 PNG crunching.
android.enablePngCrunchInReleaseBuilds=true

# Enable R8/ProGuard para reducir el tamaño del APK/AAB
# y ofuscar el código de producción.
android.enableMinifyInReleaseBuilds=true
android.enableShrinkResourcesInReleaseBuilds=true

# ============================================================
# REACT NATIVE ARCHITECTURES
# ============================================================

# Arquitecturas necesarias para dispositivos Android reales.
# x86 y x86_64 se utilizan principalmente para emuladores.
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# React Native New Architecture.
newArchEnabled=true

# Hermes JavaScript engine.
hermesEnabled=true

# ============================================================
# EDGE-TO-EDGE
# ============================================================

edgeToEdgeEnabled=true

# Propiedad mantenida por compatibilidad con Expo SDK actual.
# Está deprecada y podrá eliminarse al migrar a Expo SDK 55.
expo.edgeToEdgeEnabled=true

# ============================================================
# EXPO IMAGE SUPPORT
# ============================================================

expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# ============================================================
# EXPO DEVELOPMENT
# ============================================================

# Network inspector para development builds.
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Utilizar el empaquetado moderno de librerías nativas.
expo.useLegacyPackaging=false
