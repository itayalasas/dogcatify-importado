trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing              # IOS_P12_PASSWORD, etc.
  - name: NODE_VERSION
    value: '18.x'

  # Por ahora estas dos sólo las documentamos (están hardcodeadas abajo)
  - name: IOS_WORKSPACE
    value: 'DogCatiFy.xcworkspace'  # nombre EXACTO del .xcworkspace

  - name: IOS_SCHEME
    value: 'DogCatiFy'              # nombre EXACTO del Scheme en Xcode

steps:
  # 1. Instalar Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Instalar Node.js'

  # 2. Instalar dependencias npm + CocoaPods
  - script: |
      echo "== Instalar dependencias npm =="
      npm install

      echo "== Instalar CocoaPods =="
      cd ios
      pod install
    displayName: 'Instalar dependencias iOS (npm + pods)'

  # 3. Descargar certificado (.p12)
  - task: DownloadSecureFile@1
    name: iosCert
    inputs:
      secureFile: 'dogcatify-ios.p12'
    displayName: 'Descargar certificado iOS (.p12)'

  # 4. Descargar provisioning profile (.mobileprovision)
  - task: DownloadSecureFile@1
    name: iosProfile
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'
    displayName: 'Descargar provisioning profile (.mobileprovision)'

  # 5. Importar cert y copiar profile a la carpeta que Xcode espera
  - script: |
      echo "== Preparar certificado y provisioning profile =="

      CERT_PATH="$(iosCert.secureFilePath)"
      PROFILE_PATH="$(iosProfile.secureFilePath)"

      echo "Certificado descargado en: $CERT_PATH"
      echo "Profile descargado en     : $PROFILE_PATH"

      # Importar el .p12 al llavero de login
      security import "$CERT_PATH" \
        -k ~/Library/Keychains/login.keychain-db \
        -P "$(IOS_P12_PASSWORD)" \
        -A

      # Carpeta donde Xcode busca los provisioning profiles
      PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
      mkdir -p "$PROFILES_DIR"

      # Copiar el profile allí
      cp "$PROFILE_PATH" "$PROFILES_DIR/DogCatiFy_AppStore.mobileprovision"

      echo "Profiles en $PROFILES_DIR:"
      ls "$PROFILES_DIR"
    displayName: 'Preparar certificados iOS'
    env:
      IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)

  # 6. Compilar y exportar el .ipa
  - script: |
      set -e
      cd ios

      WORKSPACE="DogCatiFy.xcworkspace"
      SCHEME="DogCatiFy"

      ARCHIVE_PATH="$PWD/build/DogCatiFy.xcarchive"
      EXPORT_PATH="$PWD/build/export"

      echo "== Archive con xcodebuild =="
      xcodebuild \
        -workspace "$WORKSPACE" \
        -scheme "$SCHEME" \
        -configuration Release \
        -archivePath "$ARCHIVE_PATH" \
        archive \
        -allowProvisioningUpdates

      echo "== Export .ipa =="
      xcodebuild \
        -exportArchive \
        -archivePath "$ARCHIVE_PATH" \
        -exportPath "$EXPORT_PATH" \
        -exportOptionsPlist exportOptions.plist \
        -allowProvisioningUpdates

      echo "Contenido de $EXPORT_PATH:"
      ls -R "$EXPORT_PATH"
    displayName: 'Compilar y exportar .ipa'

  # 7. Publicar artefacto (.ipa)
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: 'ios/build/export'
      artifactName: 'ios-app'
      publishLocation: 'Container'
    displayName: 'Publicar artefacto iOS'
