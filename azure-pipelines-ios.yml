trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing

  - name: NODE_VERSION
    value: '18.x'

  # Deben coincidir EXACTAMENTE con lo que ves en Xcode
  - name: IOS_WORKSPACE
    value: 'DogCatiFy.xcworkspace'   # nombre del .xcworkspace

  - name: IOS_SCHEME
    value: 'DogCatiFy'               # nombre del Scheme

steps:
  # 1. Instalar Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Instalar Node.js'

  # 2. Dependencias (npm + CocoaPods)
  - script: |
      set -e
      echo "Instalando dependencias npm..."
      npm install

      echo "Instalando pods..."
      cd ios
      pod install
    displayName: 'Instalar dependencias iOS'

  # 3. Descargar certificado (.p12) y provisioning profile
  - task: DownloadSecureFile@1
    name: iosCert
    inputs:
      secureFile: 'dogcatify-ios.p12'
    displayName: 'Descargar certificado .p12'

  - task: DownloadSecureFile@1
    name: iosProfile
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'
    displayName: 'Descargar provisioning profile'

  # 4. Importar certificado en el llavero y copiar provisioning profile
  - script: |
      set -e

      echo "Preparando carpetas..."
      mkdir -p "$HOME/certs"
      mkdir -p "$HOME/profiles"

      echo "Copiando archivos seguros..."
      cp "$(iosCert.secureFilePath)" "$HOME/certs/dogcatify-ios.p12"
      cp "$(iosProfile.secureFilePath)" "$HOME/profiles/DogCatiFy_AppStore.mobileprovision"

      KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"

      echo "Desbloqueando keychain: $KEYCHAIN"
      security unlock-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN"

      echo "Importando certificado en el keychain..."
      security import "$HOME/certs/dogcatify-ios.p12" \
        -k "$KEYCHAIN" \
        -P "$IOS_P12_PASSWORD" \
        -T /usr/bin/codesign

      echo "Instalando provisioning profile..."
      mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
      cp "$HOME/profiles/DogCatiFy_AppStore.mobileprovision" \
         "$HOME/Library/MobileDevice/Provisioning Profiles/"

      echo "Certificados y profile preparados correctamente."
    displayName: 'Preparar certificados iOS'
    env:
      IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)
      MAC_KEYCHAIN_PASSWORD: $(MAC_KEYCHAIN_PASSWORD)

  # 5. Compilar y exportar .ipa
  - script: |
      set -e
      cd ios

      echo "Archivando proyecto con xcodebuild..."
      xcodebuild \
        -workspace "$(IOS_WORKSPACE)" \
        -scheme "$(IOS_SCHEME)" \
        -configuration Release \
        -archivePath build/DogCatiFy.xcarchive \
        archive \
        DEVELOPMENT_TEAM="$(IOS_TEAM_ID)" \
        PRODUCT_BUNDLE_IDENTIFIER="$(IOS_BUNDLE_ID)"

      echo "Exportando .ipa..."
      xcodebuild \
        -exportArchive \
        -archivePath build/DogCatiFy.xcarchive \
        -exportPath build/export \
        -exportOptionsPlist exportOptions.plist

      echo "Build iOS finalizada."
    displayName: 'Compilar y exportar .ipa'
    env:
      IOS_WORKSPACE: $(IOS_WORKSPACE)
      IOS_SCHEME: $(IOS_SCHEME)
      IOS_BUNDLE_ID: $(IOS_BUNDLE_ID)
      IOS_TEAM_ID: $(IOS_TEAM_ID)

  # 6. Publicar artefacto (.ipa)
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: 'ios/build/export'
      artifactName: 'ios-app'
      publishLocation: 'Container'
    displayName: 'Publicar artefacto iOS'
