trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing
  - name: NODE_VERSION
    value: '18.x'
  - name: IOS_WORKSPACE
    value: 'dogcatify.xcworkspace'      # o el nombre real del .xcworkspace
  - name: IOS_SCHEME
    value: 'DogCatiFy'  

steps:
  # 1. Node
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Instalar Node.js'

  # 2. Dependencias
  - script: |
      npm install
    displayName: 'Instalar dependencias (npm install)'

  # 3. Prebuild iOS (genera carpeta ios/)
  - script: |
      npx expo prebuild --platform ios --non-interactive
    displayName: 'Expo prebuild iOS'

  # 4. Pods
  - script: |
      cd ios
      pod install
    displayName: 'Instalar CocoaPods'

  # 5. Descargar certificados/profiles
  - task: DownloadSecureFile@1
    name: iosCert
    inputs:
      secureFile: 'dogcatify-ios.p12'
    displayName: 'Descargar certificado .p12'

  - task: DownloadSecureFile@1
    name: iosProfile
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'
    displayName: 'Descargar provisioning profile'

  # 6. Copiar cert y profile a rutas que usemos para xcodebuild
  - script: |
      mkdir -p $HOME/certs
      mkdir -p $HOME/profiles

      cp "$(iosCert.secureFilePath)" "$HOME/certs/dogcatify-ios.p12"
      cp "$(iosProfile.secureFilePath)" "$HOME/profiles/DogCatiFy_AppStore.mobileprovision"

      echo "Cert y profile copiados"
    displayName: 'Preparar certificados iOS'

  # 7. Build y export .ipa (muy simplificado)
  - script: |
      cd ios

      # Nombre del esquema y workspace (ajusta si tu app se llama distinto)
      SCHEME="dogcatify"
      WORKSPACE="dogcatify.xcworkspace"

      # Ruta de archivo de exportación
      ARCHIVE_PATH="$PWD/build/DogCatiFy.xcarchive"
      EXPORT_PATH="$PWD/build/export"

      xcodebuild \
        -workspace "$WORKSPACE" \
        -scheme "$SCHEME" \
        -configuration Release \
        -archivePath "$ARCHIVE_PATH" \
        archive \
        DEVELOPMENT_TEAM="" \
        PRODUCT_BUNDLE_IDENTIFIER="$(IOS_BUNDLE_ID)"

      xcodebuild \
        -exportArchive \
        -archivePath "$ARCHIVE_PATH" \
        -exportPath "$EXPORT_PATH" \
        -exportOptionsPlist ../exportOptions.plist
    displayName: 'Compilar y exportar .ipa'
    env:
      IOS_BUNDLE_ID: $(IOS_BUNDLE_ID)
      IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)

  # 8. Publicar artefacto (.ipa)
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: 'ios/build/export'
      artifactName: 'ios-app'
      publishLocation: 'Container'
    displayName: 'Publicar artefacto iOS'
