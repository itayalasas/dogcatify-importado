trigger:
  - dev          # o main, según la rama que uses

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing        # IOS_BUNDLE_ID, IOS_EXPORT_METHOD, IOS_P12_PASSWORD, IOS_TEAM_ID
  - name: NODE_VERSION
    value: '18.x'

steps:
  # 1. Instalar Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Instalar Node.js'

  # 2. Instalar dependencias (npm + CocoaPods)
  - script: |
      set -e
      npm install
      cd ios
      pod install
    displayName: 'Instalar dependencias iOS'

  # 3. Descargar certificado y provisioning profile desde Secure Files
  - task: DownloadSecureFile@1
    name: iosCert
    inputs:
      secureFile: 'dogcatify-ios.p12'
    displayName: 'Descargar certificado .p12'

  - task: DownloadSecureFile@1
    name: iosProfile
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'
    displayName: 'Descargar provisioning profile'

  # 4. Importar certificado y copiar profile al sitio que usa Xcode
  - script: |
      set -e

      CERT_PATH="$(iosCert.secureFilePath)"
      PROFILE_PATH="$(iosProfile.secureFilePath)"

      echo "📄 Certificado: $CERT_PATH"
      echo "📄 Provisioning profile: $PROFILE_PATH"

      echo "🔑 Importando .p12 en el llavero de login…"
      security import "$CERT_PATH" \
        -P "$IOS_P12_PASSWORD" \
        -A \
        -k "$HOME/Library/Keychains/login.keychain-db"

      echo "📦 Instalando provisioning profile…"
      UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")

      mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
      cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      echo "✅ Profile instalado como $UUID.mobileprovision"
    displayName: 'Preparar certificados iOS'
    env:
      IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)

  # 5. Crear exportOptions.plist para la exportación del .ipa
  - script: |
      set -e
      cd ios

      cat <<EOF > exportOptions.plist
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
        <dict>
          <key>method</key>
          <string>$IOS_EXPORT_METHOD</string>
          <key>teamID</key>
          <string>$IOS_TEAM_ID</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>provisioningProfiles</key>
          <dict>
            <key>$IOS_BUNDLE_ID</key>
            <string>DogCatiFy_AppStore</string>
          </dict>
        </dict>
      </plist>
      EOF

      echo "✅ exportOptions.plist generado"
    displayName: 'Crear exportOptions.plist'
    env:
      IOS_EXPORT_METHOD: $(IOS_EXPORT_METHOD)
      IOS_TEAM_ID: $(IOS_TEAM_ID)
      IOS_BUNDLE_ID: $(IOS_BUNDLE_ID)

  # 6. Compilar y archivar (.xcarchive) y luego exportar .ipa
  - script: |
      set -e
      cd ios

      echo "🏗  Archivando con workspace DogCatiFy.xcworkspace y scheme DogCatiFy…"

      xcodebuild \
        -workspace DogCatiFy.xcworkspace \
        -scheme DogCatiFy \
        -configuration Release \
        -archivePath build/DogCatiFy.xcarchive \
        archive \
        DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
        PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"

      echo "📦 Exportando .ipa…"

      xcodebuild \
        -exportArchive \
        -archivePath build/DogCatiFy.xcarchive \
        -exportPath build/export \
        -exportOptionsPlist exportOptions.plist

      echo "✅ IPA generado en ios/build/export"
    displayName: 'Compilar y exportar .ipa'
    env:
      IOS_TEAM_ID: $(IOS_TEAM_ID)
      IOS_BUNDLE_ID: $(IOS_BUNDLE_ID)

  # 7. Publicar el artefacto (.ipa) en Azure DevOps
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: 'ios/build/export'
      artifactName: 'ios-app'
      publishLocation: 'Container'
    displayName: 'Publicar artefacto iOS'
