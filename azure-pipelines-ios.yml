trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing
  - name: NODE_VERSION
    value: '18.x'
  # Deben coincidir EXACTAMENTE con lo que ves en Xcode
  - name: IOS_WORKSPACE
    value: 'dogcatify.xcworkspace'      # cambia si tu workspace se llama distinto

  - name: IOS_SCHEME
    value: 'DogCatiFy'

steps:
  # 1. Node
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Instalar Node.js'

  # 2. Dependencias
  - script: |
      npm install
      cd ios
      pod install
    displayName: 'Instalar dependencias iOS'

  # 3. Certificados
  - task: DownloadSecureFile@1
    name: iosCert
    inputs:
      secureFile: 'dogcatify-ios.p12'

  - task: DownloadSecureFile@1
    name: iosProfile
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'

  - script: |
      mkdir -p $HOME/certs
      mkdir -p $HOME/profiles

      cp "$(iosCert.secureFilePath)" "$HOME/certs/dogcatify-ios.p12"
      cp "$(iosProfile.secureFilePath)" "$HOME/profiles/DogCatiFy_AppStore.mobileprovision"

      security import $HOME/certs/dogcatify-ios.p12 -P "$(IOS_P12_PASSWORD)" -A
    displayName: 'Preparar certificados iOS'

  # 4. Compilar .ipa
  - script: |
      cd ios
      xcodebuild \
        -workspace DogCatiFy.xcworkspace \
        -scheme DogCatiFy \
        -configuration Release \
        -archivePath build/DogCatiFy.xcarchive \
        archive

      xcodebuild \
        -exportArchive \
        -archivePath build/DogCatiFy.xcarchive \
        -exportPath build/export \
        -exportOptionsPlist exportOptions.plist
    displayName: 'Compilar y exportar .ipa'

  # 5. Publicar artefacto
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: 'ios/build/export'
      artifactName: 'ios-app'
      publishLocation: 'Container'
