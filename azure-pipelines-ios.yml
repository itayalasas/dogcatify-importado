trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing          # IOS_BUNDLE_ID, IOS_EXPORT_METHOD, IOS_P12_PASSWORD, IOS_TEAM_ID, MAC_KEYCHAIN_PASSWORD
  - name: NODE_VERSION
    value: '18.x'
  - name: IOS_WORKSPACE
    value: 'DogCatiFy.xcworkspace'     # nombre del workspace en /ios
  - name: IOS_SCHEME
    value: 'DogCatiFy'                 # scheme de Xcode

steps:
  # 1. Node
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Instalar Node.js'

  # 2. Dependencias JS + Pods
  - script: |
      set -e
      npm install
      cd ios
      pod install
    displayName: 'Instalar dependencias iOS (npm + CocoaPods)'

  # 3. Descargar certificado (.p12) y provisioning (.mobileprovision)
  - task: DownloadSecureFile@1
    name: iosCert
    inputs:
      secureFile: 'dogcatify-ios.p12'
    displayName: 'Descargar certificado .p12'

  - task: DownloadSecureFile@1
    name: iosProfile
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'
    displayName: 'Descargar provisioning profile'

  # 4. Importar certificado y registrar provisioning profile
  - script: |
      set -e

      CERT_PATH="$(iosCert.secureFilePath)"
      PROFILE_PATH="$(iosProfile.secureFilePath)"

      echo ">>> Importando certificado en login.keychain-db"
      security import "$CERT_PATH" \
        -k "$HOME/Library/Keychains/login.keychain-db" \
        -P "$IOS_P12_PASSWORD" \
        -T /usr/bin/codesign \
        -T /usr/bin/security

      echo ">>> Ajustando permisos del llavero para codesign"
      security set-key-partition-list \
        -S apple-tool:,apple: \
        -s \
        -k "$MAC_KEYCHAIN_PASSWORD" \
        "$HOME/Library/Keychains/login.keychain-db"

      echo ">>> Instalando provisioning profile"
      UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
        "$(security cms -D -i "$PROFILE_PATH")")

      mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
      cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      echo "Profile copiado como $UUID.mobileprovision"
    displayName: 'Preparar certificados iOS'
    env:
      IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)
      MAC_KEYCHAIN_PASSWORD: $(MAC_KEYCHAIN_PASSWORD)

  # 5. Crear exportOptions.plist para la exportación del .ipa
- script: |
    set -e

    # Crear el directorio por si no existe
    mkdir -p ios

    cat <<EOF > ios/exportOptions.plist
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
      <dict>
        <key>method</key>
        <string>$(IOS_EXPORT_METHOD)</string>
        <key>teamID</key>
        <string>$(IOS_TEAM_ID)</string>
        <key>signingStyle</key>
        <string>manual</string>
        <key>provisioningProfiles</key>
        <dict>
          <key>$(IOS_BUNDLE_ID)</key>
          <string>DogCatiFy_AppStore</string>
        </dict>
      </dict>
    </plist>
    EOF
  displayName: 'Crear exportOptions.plist para exportar el .ipa'

# 6. Compilar y exportar .ipa
- script: |
    cd ios

    xcodebuild \
      -workspace DogCatiFy.xcworkspace \
      -scheme DogCatiFy \
      -configuration Release \
      -archivePath build/DogCatiFy.xcarchive \
      archive \
      DEVELOPMENT_TEAM=$(IOS_TEAM_ID) \
      PRODUCT_BUNDLE_IDENTIFIER=$(IOS_BUNDLE_ID)

    xcodebuild \
      -exportArchive \
      -archivePath build/DogCatiFy.xcarchive \
      -exportPath build/export \
      -exportOptionsPlist exportOptions.plist
  displayName: 'Compilar y exportar .ipa'

# 7. Publicar artefacto
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'ios/build/export'
    artifactName: 'ios-app'
    publishLocation: 'Container'
  displayName: 'Publicar artefacto iOS'
