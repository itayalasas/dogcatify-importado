trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing

  - name: NODE_VERSION
    value: '18.x'
  - name: IOS_SCHEME
    value: 'DogCatiFy'
  - name: IOS_CONFIGURATION
    value: 'Release'
  - name: KEYCHAIN_NAME
    value: 'build.keychain'

steps:
# ---------------------------
# Checkout
# ---------------------------
- checkout: self
  clean: true
  fetchDepth: 0

# ---------------------------
# Node
# ---------------------------
- task: NodeTool@0
  inputs:
    versionSpec: '$(NODE_VERSION)'
  displayName: 'Instalar Node.js'

- script: |
    node -v
    npm -v
  displayName: 'Ver versiones Node/NPM'

# ---------------------------
# Dependencias JS
# ---------------------------
- script: |
    npm ci
  displayName: 'Instalar dependencias JS'

# ---------------------------
# Expo prebuild (NATIVO)
# ---------------------------
- script: |
    npx expo prebuild -p ios --no-install --clean
  displayName: 'Expo prebuild iOS (NATIVO, sin Expo Dev)'

# ---------------------------
# CocoaPods
# ---------------------------
- script: |
    cd ios
    pod deintegrate
    pod install
  displayName: 'Instalar CocoaPods (limpio)'

# ---------------------------
# Certificados
# ---------------------------
- task: DownloadSecureFile@1
  name: iosCert
  inputs:
    secureFile: 'dogcatify-ios.p12'

- task: DownloadSecureFile@1
  name: iosProfile
  inputs:
    secureFile: 'DogCatiFy_AppStore.mobileprovision'

# ---------------------------
# Keychain + Provisioning
# ---------------------------
- script: |
    security delete-keychain $(KEYCHAIN_NAME) || true
    security create-keychain -p "$(MAC_KEYCHAIN_PASSWORD)" $(KEYCHAIN_NAME)
    security unlock-keychain -p "$(MAC_KEYCHAIN_PASSWORD)" $(KEYCHAIN_NAME)
    security list-keychains -s $(KEYCHAIN_NAME)

    security import $(iosCert.secureFilePath) \
      -k $(KEYCHAIN_NAME) \
      -P "$(IOS_P12_PASSWORD)" \
      -A

    security set-key-partition-list -S apple-tool:,apple: \
      -s -k "$(MAC_KEYCHAIN_PASSWORD)" $(KEYCHAIN_NAME)

    UUID=$(security cms -D -i $(iosProfile.secureFilePath) | plutil -extract UUID raw -o - -)
    mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
    cp $(iosProfile.secureFilePath) "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
  env:
    IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)
    MAC_KEYCHAIN_PASSWORD: $(MAC_KEYCHAIN_PASSWORD)
  displayName: 'Configurar keychain y provisioning'

# ---------------------------
# ARCHIVE NATIVO (CLAVE)
# ---------------------------
- script: |
    set -e

    WS=$(find ios -name "*.xcworkspace" | head -n 1)

    xcodebuild archive \
      -workspace "$WS" \
      -scheme "$(IOS_SCHEME)" \
      -configuration Release \
      -sdk iphoneos \
      -destination "generic/platform=iOS" \
      -archivePath "$(Build.ArtifactStagingDirectory)/DogCatiFy.xcarchive" \
      CODE_SIGN_STYLE=Manual \
      CODE_SIGNING_ALLOWED=YES \
      DEVELOPMENT_TEAM="$(IOS_TEAM_ID)" \
      PRODUCT_BUNDLE_IDENTIFIER="$(IOS_BUNDLE_ID)" \
      PROVISIONING_PROFILE_SPECIFIER="DogCatiFy_AppStore" \
      ONLY_ACTIVE_ARCH=NO \
      | tee archive.log
  displayName: 'Archive iOS (NATIVO)'

# ---------------------------
# Export IPA
# ---------------------------
- script: |
    xcodebuild -exportArchive \
      -archivePath "$(Build.ArtifactStagingDirectory)/DogCatiFy.xcarchive" \
      -exportPath "$(Build.ArtifactStagingDirectory)/export" \
      -exportOptionsPlist ios/exportOptions.plist
  displayName: 'Export IPA'

# ---------------------------
# Artefactos
# ---------------------------
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)/export'
    artifactName: 'ios-ipa'
