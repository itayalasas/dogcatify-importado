trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing
  - name: NODE_VERSION
    value: '18.x'

steps:
# -----------------------
# 1. Checkout
# -----------------------
- checkout: self
  clean: true

# -----------------------
# 2. Node
# -----------------------
- task: NodeTool@0
  inputs:
    versionSpec: '$(NODE_VERSION)'
  displayName: 'Instalar Node.js'

# -----------------------
# 3. Dependencias JS
# -----------------------
- script: |
    npm install
  displayName: 'Instalar dependencias JS'

# -----------------------
# 4. Prebuild iOS (Expo → nativo)
# -----------------------
- script: |
    npx expo prebuild --platform ios --non-interactive
  displayName: 'Expo prebuild iOS'

# -----------------------
# 5. CocoaPods
# -----------------------
- script: |
    cd ios
    pod install
  displayName: 'Instalar CocoaPods'

# -----------------------
# 6. Descargar certificado y profile
# -----------------------
- task: DownloadSecureFile@1
  name: iosCert
  inputs:
    secureFile: 'dogcatify-ios.p12'

- task: DownloadSecureFile@1
  name: iosProfile
  inputs:
    secureFile: 'DogCatiFy_AppStore.mobileprovision'

# -----------------------
# 7. Importar certificado (SIN InstallAppleCertificate)
# -----------------------
- script: |
    echo "Importando certificado en login.keychain"

    security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true

    security import "$(iosCert.secureFilePath)" \
      -k ~/Library/Keychains/login.keychain-db \
      -P "$(IOS_P12_PASSWORD)" \
      -T /usr/bin/codesign \
      -T /usr/bin/security \
      -A

    security set-key-partition-list \
      -S apple-tool:,apple: \
      -s \
      -k "" \
      ~/Library/Keychains/login.keychain-db
  displayName: 'Importar certificado iOS'

# -----------------------
# 8. Instalar provisioning profile
# -----------------------
- script: |
    mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
    UUID=$(grep -aA1 UUID "$(iosProfile.secureFilePath)" | grep -o "[-A-F0-9]\{36\}")
    cp "$(iosProfile.secureFilePath)" \
       ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
  displayName: 'Instalar provisioning profile'

# -----------------------
# 9. Crear exportOptions.plist
# -----------------------
- script: |
    cat <<EOF > ios/exportOptions.plist
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
      <key>method</key>
      <string>$(IOS_EXPORT_METHOD)</string>
      <key>teamID</key>
      <string>$(IOS_TEAM_ID)</string>
      <key>signingStyle</key>
      <string>manual</string>
      <key>provisioningProfiles</key>
      <dict>
        <key>$(IOS_BUNDLE_ID)</key>
        <string>DogCatiFy_AppStore</string>
      </dict>
    </dict>
    </plist>
    EOF
  displayName: 'Crear exportOptions.plist'

# -----------------------
# 10. Build y export IPA
# -----------------------
- script: |
    cd ios

    xcodebuild \
      -workspace DogCatiFy.xcworkspace \
      -scheme DogCatiFy \
      -configuration Release \
      -archivePath build/DogCatiFy.xcarchive \
      CODE_SIGN_STYLE=Manual \
      DEVELOPMENT_TEAM=$(IOS_TEAM_ID) \
      PRODUCT_BUNDLE_IDENTIFIER=$(IOS_BUNDLE_ID) \
      archive

    xcodebuild \
      -exportArchive \
      -archivePath build/DogCatiFy.xcarchive \
      -exportPath build/export \
      -exportOptionsPlist exportOptions.plist
  displayName: 'Compilar y exportar .ipa'

# -----------------------
# 11. Publicar artefacto
# -----------------------
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'ios/build/export'
    artifactName: 'ios-app'
    publishLocation: 'Container'
  displayName: 'Publicar artefacto iOS'
