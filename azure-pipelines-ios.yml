trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing

  - name: NODE_VERSION
    value: '18.x'

  - name: IOS_SCHEME
    value: 'DogCatiFy'

  - name: IOS_CONFIGURATION
    value: 'Release'

  - name: KEYCHAIN_NAME
    value: 'build.keychain'

  # Apple recomienda "app-store-connect".
  - name: IOS_EXPORT_METHOD
    value: 'app-store-connect'

  # Debe coincidir con el "Name" dentro del .mobileprovision.
  - name: IOS_PROFILE_NAME
    value: 'DogCatiFy_AppStore'

  - name: IOS_MARKETING_VERSION
    value: '1.0.0'

  # Build incremental automatico.
  - name: IOS_BUILD_NUMBER
    value: $(Build.BuildId)

  # Para builds normales dejar false. Si necesitas limpiar todo, correr con true.
  - name: IOS_CLEAN_BUILD
    value: 'false'

  # Cache local persistente en self-hosted agent.
  - name: NPM_CACHE_FOLDER
    value: '$(Pipeline.Workspace)/.npm'

  - name: IOS_DERIVED_DATA
    value: '$(Pipeline.Workspace)/DerivedData/$(IOS_SCHEME)'

steps:
  - checkout: self
    clean: false
    fetchDepth: 1

  # Reemplaza NodeTool@0 para evitar warning de tarea deprecada.
  - task: UseNode@1
    displayName: 'Instalar Node.js'
    inputs:
      version: '$(NODE_VERSION)'

  - script: |
      set -e
      echo "Arquitectura del agente:"
      uname -m
      arch
      echo "Node:"
      node -v
      npm -v

      if [ "$(uname -m)" != "arm64" ]; then
        echo "##vso[task.logissue type=warning]El agente no esta corriendo nativo ARM64. En Mac Apple Silicon esto puede hacer que Xcode parezca colgado por emulacion x64/Rosetta."
      fi
    displayName: 'Ver versiones Node/NPM + arquitectura'

  - task: Cache@2
    displayName: 'Cache npm'
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: '$(NPM_CACHE_FOLDER)'

  - script: |
      set -e
      npm ci --cache "$(NPM_CACHE_FOLDER)" --prefer-offline --no-audit
    displayName: 'Instalar dependencias (npm ci con cache)'

  - script: |
      set -e
      if [ ! -d "ios" ]; then
        echo "No existe ios/, ejecutando expo prebuild..."
        npx expo prebuild -p ios --no-install
      else
        echo "Existe ios/, saltando expo prebuild."
      fi
    displayName: 'Expo prebuild iOS (si aplica)'

  - task: Cache@2
    displayName: 'Cache CocoaPods'
    inputs:
      key: 'pods | "$(Agent.OS)" | ios/Podfile.lock'
      restoreKeys: |
        pods | "$(Agent.OS)"
      path: 'ios/Pods'

  - script: |
      set -e
      cd ios

      if [ -f "Pods/Manifest.lock" ] && cmp -s "Podfile.lock" "Pods/Manifest.lock"; then
        echo "Pods ya estan sincronizados con Podfile.lock. Saltando pod install."
      else
        echo "Ejecutando pod install..."
        pod install
      fi
    displayName: 'Instalar CocoaPods'

  # --- Setear version y build incremental antes de compilar ---
  - script: |
      set -e
      echo "Seteando versioning iOS..."
      echo "Marketing Version: $(IOS_MARKETING_VERSION)"
      echo "Build Number:      $(IOS_BUILD_NUMBER)"

      cd ios
      xcrun agvtool new-marketing-version "$(IOS_MARKETING_VERSION)" || true
      xcrun agvtool new-version -all "$(IOS_BUILD_NUMBER)" || true

      echo "OK versioning"
    displayName: 'Set iOS Version + Build (auto incremental)'

  # --- Secure files ---
  - task: DownloadSecureFile@1
    name: iosCert
    displayName: 'Descargar certificado .p12'
    inputs:
      secureFile: 'dogcatify-ios.p12'

  - task: DownloadSecureFile@1
    name: iosProfile
    displayName: 'Descargar provisioning profile'
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'

  # --- Keychain + Import P12 + Install profile ---
  - script: |
      set -e

      CERT_PATH="$(iosCert.secureFilePath)"
      PROFILE_PATH="$(iosProfile.secureFilePath)"

      echo "CERT_PATH=$CERT_PATH"
      echo "PROFILE_PATH=$PROFILE_PATH"

      security delete-keychain "$(KEYCHAIN_NAME)" || true
      security create-keychain -p "$(MAC_KEYCHAIN_PASSWORD)" "$(KEYCHAIN_NAME)"
      security set-keychain-settings -t 3600 -l "$(KEYCHAIN_NAME)"
      security unlock-keychain -p "$(MAC_KEYCHAIN_PASSWORD)" "$(KEYCHAIN_NAME)"

      security list-keychains -d user -s "$(KEYCHAIN_NAME)" login.keychain-db
      security default-keychain -s "$(KEYCHAIN_NAME)"

      echo "Importando P12..."
      security import "$CERT_PATH" -k "$(KEYCHAIN_NAME)" -P "$(IOS_P12_PASSWORD)" -A -T /usr/bin/codesign -T /usr/bin/security
      security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$(MAC_KEYCHAIN_PASSWORD)" "$(KEYCHAIN_NAME)"

      echo "Identidades codesign:"
      security find-identity -v -p codesigning "$(KEYCHAIN_NAME)" || true

      UUID=$(/usr/bin/security cms -D -i "$PROFILE_PATH" | /usr/bin/plutil -extract UUID raw -o - -)
      NAME=$(/usr/bin/security cms -D -i "$PROFILE_PATH" | /usr/bin/plutil -extract Name raw -o - -)
      TEAM=$(/usr/bin/security cms -D -i "$PROFILE_PATH" | /usr/bin/plutil -extract TeamIdentifier.0 raw -o - -)

      echo "Profile Name: $NAME"
      echo "Profile UUID: $UUID"
      echo "Profile Team: $TEAM"

      mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
      cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      echo "Guardando profile plist para analisis..."
      /usr/bin/security cms -D -i "$PROFILE_PATH" > "$(Build.ArtifactStagingDirectory)/profile.plist"

      echo "Entitlements del profile (resumen):"
      /usr/bin/plutil -p "$(Build.ArtifactStagingDirectory)/profile.plist" | sed -n '/"Entitlements" => {/,/}/p' | head -n 220 || true
    displayName: 'Keychain + importar .p12 + instalar .mobileprovision'
    env:
      IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)
      MAC_KEYCHAIN_PASSWORD: $(MAC_KEYCHAIN_PASSWORD)

  # --- Check Associated Domains ---
  - script: |
      set -e
      echo "Validando entitlement Associated Domains en el provisioning profile..."
      /usr/bin/plutil -p "$(Build.ArtifactStagingDirectory)/profile.plist" | sed -n '/"Entitlements" => {/,/}/p' | head -n 220 || true

      if /usr/bin/plutil -p "$(Build.ArtifactStagingDirectory)/profile.plist" | grep -q 'com.apple.developer.associated-domains'; then
        echo "OK: profile incluye com.apple.developer.associated-domains"
      else
        echo "NO: profile no incluye com.apple.developer.associated-domains"
        exit 1
      fi
    displayName: 'Check: Associated Domains en profile'

  # --- Detect workspace + list schemes ---
  - script: |
      set -e
      WS=$(find ios -maxdepth 3 -name "*.xcworkspace" -print | head -n 1)
      if [ -z "$WS" ]; then
        echo "ERROR: No encontre .xcworkspace dentro de ios/"
        exit 1
      fi

      echo "Workspace encontrado: $WS"
      echo "##vso[task.setvariable variable=IOS_WORKSPACE]$WS"

      echo "Schemes:"
      xcodebuild -list -workspace "$WS"
    displayName: 'Detectar workspace + listar schemes'

  # --- Build settings diagnostico ---
  - script: |
      set -e
      echo "Build settings (signing) para verificar CODE_SIGN / BUNDLE..."

      SETTINGS_FILE="$(Build.ArtifactStagingDirectory)/build-settings-full.txt"

      xcodebuild -showBuildSettings \
        -workspace "$(IOS_WORKSPACE)" \
        -scheme "$(IOS_SCHEME)" \
        -configuration "$(IOS_CONFIGURATION)" \
        > "$SETTINGS_FILE"

      egrep -i "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN|PROVISIONING_PROFILE|ENTITLEMENTS|SIGNING|MARKETING_VERSION|CURRENT_PROJECT_VERSION" "$SETTINGS_FILE" \
        | tee "$(Build.ArtifactStagingDirectory)/build-settings-signing.txt" || true

      ENT_PATH=$(awk -F"= " '/CODE_SIGN_ENTITLEMENTS/ {print $2; exit}' "$SETTINGS_FILE" | tr -d ' ')
      echo "CODE_SIGN_ENTITLEMENTS=$ENT_PATH" | tee -a "$(Build.ArtifactStagingDirectory)/build-settings-signing.txt"

      if [ -n "$ENT_PATH" ] && [ -f "$ENT_PATH" ]; then
        echo "Contenido entitlements del target:"
        cat "$ENT_PATH" | tee "$(Build.ArtifactStagingDirectory)/target-entitlements.entitlements"
      else
        echo "No hay archivo de entitlements declarado (o no existe en path)."
      fi
    displayName: 'Diagnostico: build settings + entitlements del target'

  # --- exportOptions.plist ---
  - script: |
      set -e
      EXPORT_PLIST="$(Build.SourcesDirectory)/ios/exportOptions.plist"

      cat > "$EXPORT_PLIST" <<EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>method</key>
        <string>$(IOS_EXPORT_METHOD)</string>
        <key>teamID</key>
        <string>$(IOS_TEAM_ID)</string>
        <key>signingStyle</key>
        <string>manual</string>
        <key>provisioningProfiles</key>
        <dict>
          <key>$(IOS_BUNDLE_ID)</key>
          <string>$(IOS_PROFILE_NAME)</string>
        </dict>
      </dict>
      </plist>
      EOF

      echo "Export plist: $EXPORT_PLIST"
      plutil -p "$EXPORT_PLIST" || cat "$EXPORT_PLIST"
      echo "##vso[task.setvariable variable=EXPORT_OPTIONS_PLIST]$EXPORT_PLIST"
    displayName: 'Crear exportOptions.plist (absoluto)'

  # --- ARCHIVE NATIVO optimizado ---
  - script: |
      set -euo pipefail

      ARCHIVE_PATH="$(Build.ArtifactStagingDirectory)/$(IOS_SCHEME).xcarchive"
      LOG_ARCHIVE="$(Build.ArtifactStagingDirectory)/xcodebuild-archive.log"
      DERIVED="$(IOS_DERIVED_DATA)"
      RESULT_BUNDLE="$(Build.ArtifactStagingDirectory)/ArchiveResult.xcresult"
      JOBS="$(sysctl -n hw.logicalcpu)"

      echo "Workspace: $(IOS_WORKSPACE)"
      echo "Scheme:    $(IOS_SCHEME)"
      echo "Config:    $(IOS_CONFIGURATION)"
      echo "Team:      $(IOS_TEAM_ID)"
      echo "BundleId:  $(IOS_BUNDLE_ID)"
      echo "Profile:   $(IOS_PROFILE_NAME)"
      echo "Archive:   $ARCHIVE_PATH"
      echo "Version:   $(IOS_MARKETING_VERSION)"
      echo "Build:     $(IOS_BUILD_NUMBER)"
      echo "Derived:   $DERIVED"
      echo "Jobs:      $JOBS"
      echo "Clean:     $(IOS_CLEAN_BUILD)"

      if [ "$(IOS_CLEAN_BUILD)" = "true" ]; then
        echo "Limpiando DerivedData por IOS_CLEAN_BUILD=true"
        rm -rf "$DERIVED"
      fi

      mkdir -p "$DERIVED"

      set +e
      xcodebuild \
        -workspace "$(IOS_WORKSPACE)" \
        -scheme "$(IOS_SCHEME)" \
        -configuration "$(IOS_CONFIGURATION)" \
        -sdk iphoneos \
        -destination "generic/platform=iOS" \
        -derivedDataPath "$DERIVED" \
        -archivePath "$ARCHIVE_PATH" \
        -resultBundlePath "$RESULT_BUNDLE" \
        -parallelizeTargets \
        -jobs "$JOBS" \
        CODE_SIGN_STYLE=Manual \
        DEVELOPMENT_TEAM="$(IOS_TEAM_ID)" \
        PRODUCT_BUNDLE_IDENTIFIER="$(IOS_BUNDLE_ID)" \
        PROVISIONING_PROFILE_SPECIFIER="$(IOS_PROFILE_NAME)" \
        CODE_SIGN_IDENTITY="Apple Distribution" \
        MARKETING_VERSION="$(IOS_MARKETING_VERSION)" \
        CURRENT_PROJECT_VERSION="$(IOS_BUILD_NUMBER)" \
        COMPILER_INDEX_STORE_ENABLE=NO \
        archive 2>&1 | tee "$LOG_ARCHIVE"
      RC=${PIPESTATUS[0]}
      set -e

      echo "== Ultimas 200 lineas del log =="
      tail -n 200 "$LOG_ARCHIVE" || true

      echo "== Buscando errores tipicos =="
      egrep -n "error:|No profiles|provisioning|CodeSign|Signing|requires a development team|exportArchive" "$LOG_ARCHIVE" | tail -n 120 || true

      exit $RC
    displayName: 'Archive iOS (NATIVO optimizado)'

  # --- Extraer xcresult a json si existe ---
  - script: |
      set -e
      XR="$(Build.ArtifactStagingDirectory)/ArchiveResult.xcresult"
      if [ -d "$XR" ]; then
        echo "xcresult encontrado: $XR"
        xcrun xcresulttool get --path "$XR" --format json > "$(Build.ArtifactStagingDirectory)/xcresult.json" || true
        echo "Se guardo xcresult.json"
      else
        echo "No hay xcresult"
      fi
    displayName: 'Extraer xcresult (si existe)'
    condition: succeededOrFailed()

  # --- EXPORT IPA ---
  - script: |
      set -euo pipefail

      ARCHIVE_PATH="$(Build.ArtifactStagingDirectory)/$(IOS_SCHEME).xcarchive"
      EXPORT_PATH="$(Build.ArtifactStagingDirectory)/export"
      LOG_EXPORT="$(Build.ArtifactStagingDirectory)/xcodebuild-export.log"

      rm -rf "$EXPORT_PATH"
      mkdir -p "$EXPORT_PATH"

      echo "ExportOptionsPlist: $(EXPORT_OPTIONS_PLIST)"
      ls -la "$(EXPORT_OPTIONS_PLIST)" || true

      set +e
      xcodebuild \
        -exportArchive \
        -archivePath "$ARCHIVE_PATH" \
        -exportPath "$EXPORT_PATH" \
        -exportOptionsPlist "$(EXPORT_OPTIONS_PLIST)" 2>&1 \
        | tee "$LOG_EXPORT"
      RC=${PIPESTATUS[0]}
      set -e

      echo "== Ultimas 200 lineas export log =="
      tail -n 200 "$LOG_EXPORT" || true

      echo "IPA:"
      find "$EXPORT_PATH" -maxdepth 2 -name "*.ipa" -print

      exit $RC
    displayName: 'Export IPA'

  - task: PublishBuildArtifacts@1
    displayName: 'Publicar artefacto iOS'
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)/export'
      artifactName: 'ios-ipa'
      publishLocation: 'Container'
