trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  # Grupo con las variables secretas (IOS_P12_PASSWORD, IOS_BUNDLE_ID, etc.)
  - group: ios-signing

  - name: NODE_VERSION
    value: '18.x'

  # Deben coincidir EXACTAMENTE con lo que ves en Xcode
  - name: IOS_WORKSPACE
    value: 'dogcatify.xcworkspace'      # cambia si tu workspace se llama distinto

  - name: IOS_SCHEME
    value: 'DogCatiFy'                  # cambia si el scheme se llama distinto

steps:
  # 1. Instalar Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Instalar Node.js'

  # 2. Instalar dependencias
  - script: |
      npm install
    displayName: 'Instalar dependencias (npm install)'

  # 3. Expo prebuild iOS (genera carpeta ios/)
  - script: |
      npx expo prebuild --platform ios --non-interactive
    displayName: 'Expo prebuild iOS'

  # 4. Instalar CocoaPods
  - script: |
      cd ios
      pod install
    displayName: 'Instalar CocoaPods'

  # 5. Descargar certificado .p12
  - task: DownloadSecureFile@1
    name: iosCert
    inputs:
      secureFile: 'dogcatify-ios.p12'           # nombre EXACTO en Secure Files
    displayName: 'Descargar certificado .p12'

  # 6. Descargar provisioning profile
  - task: DownloadSecureFile@1
    name: iosProfile
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'   # nombre EXACTO en Secure Files
    displayName: 'Descargar provisioning profile'

  # 7. Importar certificado y copiar provisioning profile
  - script: |
      set -e

      echo "Cert path   : $IOS_CERT_PATH"
      echo "Profile path: $IOS_PROFILE_PATH"

      # Importar certificado en un keychain de build
      security create-keychain -p "" build.keychain
      security import "$IOS_CERT_PATH" -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
      security list-keychains -d user -s build.keychain login.keychain
      security default-keychain -d user -s build.keychain
      security unlock-keychain -p "" build.keychain

      # Copiar provisioning profile a la carpeta estándar
      mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
      cp "$IOS_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      echo "✅ Certificado y profile preparados"
    displayName: 'Preparar certificados iOS'
    env:
      IOS_CERT_PATH: $(iosCert.secureFilePath)
      IOS_PROFILE_PATH: $(iosProfile.secureFilePath)
      IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)

  # 8. Compilar y exportar .ipa
  - script: |
      set -e
      cd ios

      WORKSPACE="$(IOS_WORKSPACE)"
      SCHEME="$(IOS_SCHEME)"

      echo "Usando workspace: $WORKSPACE"
      echo "Usando scheme   : $SCHEME"

      ARCHIVE_PATH="$PWD/build/$SCHEME.xcarchive"
      EXPORT_PATH="$PWD/build/export"

      # 1) ARCHIVE
      xcodebuild \
        -workspace "$WORKSPACE" \
        -scheme "$SCHEME" \
        -configuration Release \
        -archivePath "$ARCHIVE_PATH" \
        archive

      # 2) EXPORT .IPA
      xcodebuild \
        -exportArchive \
        -archivePath "$ARCHIVE_PATH" \
        -exportPath "$EXPORT_PATH" \
        -exportOptionsPlist "exportOptions.plist"

      echo "✅ Build y export terminados"
    displayName: 'Compilar y exportar .ipa'
    env:
      IOS_WORKSPACE: $(IOS_WORKSPACE)
      IOS_SCHEME: $(IOS_SCHEME)

  # 9. Publicar artefacto (.ipa)
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: 'ios/build/export'
      artifactName: 'ios-app'
      publishLocation: 'Container'
    displayName: 'Publicar artefacto iOS'
