trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing

  - name: NODE_VERSION
    value: '18.x'

  - name: IOS_SCHEME
    value: 'DogCatiFy'

  - name: IOS_CONFIGURATION
    value: 'Release'

  - name: KEYCHAIN_NAME
    value: 'build.keychain'

steps:
# -------------------------------------------------
# Checkout
# -------------------------------------------------
- checkout: self
  clean: true
  fetchDepth: 0

# -------------------------------------------------
# Node
# -------------------------------------------------
- task: NodeTool@0
  inputs:
    versionSpec: $(NODE_VERSION)
  displayName: 'Instalar Node.js'

- script: |
    node -v
    npm -v
  displayName: 'Ver versiones Node/NPM'

# -------------------------------------------------
# JS deps
# -------------------------------------------------
- script: |
    npm ci
  displayName: 'Instalar dependencias'

# -------------------------------------------------
# Expo prebuild (solo si no existe ios/)
# -------------------------------------------------
- script: |
    if [ ! -d "ios" ]; then
      npx expo prebuild -p ios --no-install
    fi
  displayName: 'Expo prebuild iOS (solo si aplica)'

# -------------------------------------------------
# CocoaPods
# -------------------------------------------------
- script: |
    cd ios
    pod install
  displayName: 'Instalar CocoaPods'

# -------------------------------------------------
# Secure files
# -------------------------------------------------
- task: DownloadSecureFile@1
  name: iosCert
  inputs:
    secureFile: 'dogcatify-ios.p12'
  displayName: 'Descargar certificado .p12'

- task: DownloadSecureFile@1
  name: iosProfile
  inputs:
    secureFile: 'DogCatiFy_AppStore.mobileprovision'
  displayName: 'Descargar provisioning profile'

# -------------------------------------------------
# Keychain + Cert + Provisioning
# -------------------------------------------------
- script: |
    set -e

    security delete-keychain "$(KEYCHAIN_NAME)" || true
    security create-keychain -p "$(MAC_KEYCHAIN_PASSWORD)" "$(KEYCHAIN_NAME)"
    security unlock-keychain -p "$(MAC_KEYCHAIN_PASSWORD)" "$(KEYCHAIN_NAME)"
    security set-keychain-settings -t 3600 -l "$(KEYCHAIN_NAME)"
    security list-keychains -d user -s "$(KEYCHAIN_NAME)" login.keychain-db
    security default-keychain -s "$(KEYCHAIN_NAME)"

    security import "$(iosCert.secureFilePath)" \
      -k "$(KEYCHAIN_NAME)" \
      -P "$(IOS_P12_PASSWORD)" \
      -A \
      -T /usr/bin/codesign

    security set-key-partition-list \
      -S apple-tool:,apple: \
      -s \
      -k "$(MAC_KEYCHAIN_PASSWORD)" \
      "$(KEYCHAIN_NAME)"

    UUID=$(security cms -D -i "$(iosProfile.secureFilePath)" | plutil -extract UUID raw -o - -)

    mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
    cp "$(iosProfile.secureFilePath)" \
       "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

  env:
    IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)
    MAC_KEYCHAIN_PASSWORD: $(MAC_KEYCHAIN_PASSWORD)
  displayName: 'Configurar keychain + cert + provisioning'

# -------------------------------------------------
# Detect workspace
# -------------------------------------------------
- script: |
    WS=$(find ios -name "*.xcworkspace" | head -n 1)
    echo "Workspace: $WS"
    echo "##vso[task.setvariable variable=IOS_WORKSPACE]$WS"
    xcodebuild -list -workspace "$WS"
  displayName: 'Detectar workspace y schemes'

# -------------------------------------------------
# ARCHIVE (NATIVO)
# -------------------------------------------------
- script: |
    set -euo pipefail

    ARCHIVE="$(Build.ArtifactStagingDirectory)/DogCatiFy.xcarchive"
    LOG="$(Build.ArtifactStagingDirectory)/archive.log"

    xcodebuild \
      -workspace "$(IOS_WORKSPACE)" \
      -scheme "$(IOS_SCHEME)" \
      -configuration "$(IOS_CONFIGURATION)" \
      -sdk iphoneos \
      -destination "generic/platform=iOS" \
      -archivePath "$ARCHIVE" \
      clean archive | tee "$LOG"
  displayName: 'Archive iOS (nativo)'

# -------------------------------------------------
# EXPORT IPA
# -------------------------------------------------
- script: |
    EXPORT="$(Build.ArtifactStagingDirectory)/export"
    mkdir -p "$EXPORT"

    xcodebuild \
      -exportArchive \
      -archivePath "$(Build.ArtifactStagingDirectory)/DogCatiFy.xcarchive" \
      -exportPath "$EXPORT" \
      -exportOptionsPlist ios/exportOptions.plist | tee export.log

    ls -la "$EXPORT"
  displayName: 'Export IPA'

# -------------------------------------------------
# Publish artifacts
# -------------------------------------------------
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'ios-build'
  condition: succeededOrFailed()
