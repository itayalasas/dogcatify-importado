trigger:
  - dev

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing

  - name: NODE_VERSION
    value: '18.x'

  # Deben coincidir con lo que existe en ios/
  - name: IOS_WORKSPACE
    value: 'DogCatiFy.xcworkspace'   # si tu workspace real es dogcatify.xcworkspace, cámbialo
  - name: IOS_SCHEME
    value: 'DogCatiFy'

steps:
  - checkout: self
    clean: true

  # 1) Node
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Instalar Node.js'
    timeoutInMinutes: 10

  - script: |
      set -e
      node -v
      npm -v
    displayName: 'Ver versiones Node/NPM'

  # 2) Instalar deps JS
  - script: |
      set -e
      npm ci
    displayName: 'Instalar dependencias JS (npm ci)'
    timeoutInMinutes: 20

  # 3) Si NO existe ios/ (Expo managed), lo generamos. Si ya existe, lo saltamos.
  - script: |
      set -e
      if [ ! -d "ios" ]; then
        echo "No existe carpeta ios/. Ejecutando prebuild..."
        npx expo prebuild --platform ios --non-interactive
      else
        echo "Carpeta ios/ ya existe. Saltando prebuild."
      fi
    displayName: 'Expo prebuild iOS (solo si falta ios/)'
    timeoutInMinutes: 20

  # 4) CocoaPods
  - script: |
      set -e
      cd ios
      pod install --repo-update
    displayName: 'Instalar CocoaPods (pod install)'
    timeoutInMinutes: 30

  # 5) Descargar secure files
  - task: DownloadSecureFile@1
    name: p12file
    inputs:
      secureFile: 'dogcatify-ios.p12'
    displayName: 'Descargar certificado (.p12)'

  - task: DownloadSecureFile@1
    name: provfile
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'
    displayName: 'Descargar provisioning profile (.mobileprovision)'

  # 6) Keychain temporal + importar cert + instalar provisioning profile
  - script: |
      set -euo pipefail

      CERT_PATH="$(p12file.secureFilePath)"
      PROFILE_PATH="$(provfile.secureFilePath)"

      echo "CERT_PATH=$CERT_PATH"
      echo "PROFILE_PATH=$PROFILE_PATH"

      KEYCHAIN_PATH="$HOME/Library/Keychains/ios-build.keychain-db"
      KEYCHAIN_PWD="$(MAC_KEYCHAIN_PASSWORD)"

      # Si existía de corridas anteriores, lo borramos
      security delete-keychain "$KEYCHAIN_PATH" || true

      # Crear y usar keychain temporal
      security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
      security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
      security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

      # Que el sistema lo vea para codesign
      security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
      security default-keychain -s "$KEYCHAIN_PATH"

      # Importar .p12 (SIN openssl)
      security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$(IOS_P12_PASSWORD)" -A
      security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

      # Instalar provisioning profile en la ruta estándar
      mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

      UUID=$(/usr/bin/security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
      NAME=$(/usr/bin/security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin)

      echo "Provisioning UUID: $UUID"
      echo "Provisioning Name: $NAME"

      cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      # Validación rápida: que el profile aplique al bundle id
      APP_ID=$(/usr/bin/security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /dev/stdin)
      echo "Profile application-identifier: $APP_ID"
      echo "Bundle esperado: $(IOS_BUNDLE_ID)"

      # Guardar name para pasos siguientes
      echo "##vso[task.setvariable variable=PROFILE_NAME]$NAME"
      echo "##vso[task.setvariable variable=KEYCHAIN_PATH]$KEYCHAIN_PATH"
    displayName: 'Keychain + importar .p12 + instalar .mobileprovision'
    env:
      IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)
      MAC_KEYCHAIN_PASSWORD: $(MAC_KEYCHAIN_PASSWORD)
      IOS_BUNDLE_ID: $(IOS_BUNDLE_ID)
    timeoutInMinutes: 10

  # 7) Crear exportOptions.plist (sin romper YAML)
  - script: |
      set -euo pipefail

      cat > ios/exportOptions.plist <<'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>method</key>
        <string>app-store</string>
        <key>signingStyle</key>
        <string>manual</string>
        <key>teamID</key>
        <string>$(IOS_TEAM_ID)</string>
        <key>provisioningProfiles</key>
        <dict>
          <key>$(IOS_BUNDLE_ID)</key>
          <string>$(PROFILE_NAME)</string>
        </dict>
        <key>stripSwiftSymbols</key>
        <true/>
        <key>compileBitcode</key>
        <false/>
      </dict>
      </plist>
      EOF

      echo "exportOptions.plist creado:"
      plutil -p ios/exportOptions.plist
    displayName: 'Crear exportOptions.plist'
    env:
      IOS_TEAM_ID: $(IOS_TEAM_ID)
      IOS_BUNDLE_ID: $(IOS_BUNDLE_ID)

  # 8) Listar schemes (para confirmar que CI ve el scheme shared)
  - script: |
      set -e
      cd ios
      xcodebuild -list -workspace "$(IOS_WORKSPACE)"
    displayName: 'Listar schemes del workspace (debug)'
    timeoutInMinutes: 5

  # 9) Archive + Export IPA
  - script: |
      set -euo pipefail
      cd ios

      ARCHIVE_PATH="$PWD/build/DogCatiFy.xcarchive"
      EXPORT_PATH="$PWD/build/export"

      rm -rf "$PWD/build"
      mkdir -p "$EXPORT_PATH"

      echo "Usando keychain: $(KEYCHAIN_PATH)"
      security show-keychain-info "$(KEYCHAIN_PATH)" || true

      xcodebuild \
        -workspace "$(IOS_WORKSPACE)" \
        -scheme "$(IOS_SCHEME)" \
        -configuration Release \
        -archivePath "$ARCHIVE_PATH" \
        -sdk iphoneos \
        CODE_SIGN_STYLE=Manual \
        DEVELOPMENT_TEAM="$(IOS_TEAM_ID)" \
        PRODUCT_BUNDLE_IDENTIFIER="$(IOS_BUNDLE_ID)" \
        PROVISIONING_PROFILE_SPECIFIER="$(PROFILE_NAME)" \
        archive

      xcodebuild \
        -exportArchive \
        -archivePath "$ARCHIVE_PATH" \
        -exportPath "$EXPORT_PATH" \
        -exportOptionsPlist "$PWD/exportOptions.plist"

      echo "Contenido export:"
      ls -la "$EXPORT_PATH"
    displayName: 'Compilar y exportar .ipa'
    env:
      IOS_TEAM_ID: $(IOS_TEAM_ID)
      IOS_BUNDLE_ID: $(IOS_BUNDLE_ID)
    timeoutInMinutes: 60

  # 10) Publicar artefacto
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: 'ios/build/export'
      artifactName: 'ios-app'
      publishLocation: 'Container'
    displayName: 'Publicar artefacto iOS'
