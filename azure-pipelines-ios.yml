trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing

  - name: NODE_VERSION
    value: '18.x'

  - name: IOS_SCHEME
    value: 'DogCatiFy'

  - name: IOS_CONFIGURATION
    value: 'Release'

  - name: KEYCHAIN_NAME
    value: 'build.keychain'

  - name: IOS_EXPORT_METHOD
    value: 'app-store-connect'

  - name: IOS_PROFILE_NAME
    value: 'DogCatiFy_AppStore'

  - name: IOS_MARKETING_VERSION
    value: '1.0.0'

  - name: IOS_BUILD_NUMBER
    value: $(Build.BuildId)

steps:
  # ============================================================
  # CHECKOUT
  # ============================================================
  - checkout: self
    clean: true
    fetchDepth: 0

  # ============================================================
  # LIMPIAR RESIDUOS DEL AGENTE SELF-HOSTED
  # ============================================================
  - script: |
      set -euo pipefail

      echo "Limpiando residuos de ejecuciones anteriores..."

      rm -rf "$(Build.ArtifactStagingDirectory)/DerivedData"
      rm -rf "$(Build.ArtifactStagingDirectory)"/*.xcarchive
      rm -rf "$(Build.ArtifactStagingDirectory)/export"
      rm -rf "$(Build.ArtifactStagingDirectory)/ArchiveResult.xcresult"
      rm -f "$(Build.ArtifactStagingDirectory)/xcodebuild-archive.log"
      rm -f "$(Build.ArtifactStagingDirectory)/xcodebuild-export.log"

      mkdir -p "$(Build.ArtifactStagingDirectory)"

      echo "Eliminando archivos AppleDouble..."
      find "$(Build.SourcesDirectory)" -name "._*" -type f -delete || true

      echo "Limpiando atributos extendidos del código fuente..."
      xattr -cr "$(Build.SourcesDirectory)" || true

      echo "Workspace preparado."
    displayName: 'Preparar workspace limpio'

  # ============================================================
  # NODE
  # ============================================================
  - task: NodeTool@0
    displayName: 'Instalar Node.js'
    inputs:
      versionSpec: '$(NODE_VERSION)'

  - script: |
      set -e

      echo "Node:"
      node -v

      echo "NPM:"
      npm -v

      echo "Xcode:"
      xcodebuild -version

      echo "macOS:"
      sw_vers
    displayName: 'Ver versiones del entorno'

  # ============================================================
  # DEPENDENCIAS NPM
  # ============================================================
  - script: |
      set -euo pipefail

      npm ci
    displayName: 'Instalar dependencias (npm ci)'

  # ============================================================
  # EXPO PREBUILD
  # ============================================================
  - script: |
      set -euo pipefail

      if [ ! -d "ios" ]; then
        echo "No existe ios/. Ejecutando Expo prebuild..."
        npx expo prebuild -p ios --no-install
      else
        echo "Existe ios/. Saltando Expo prebuild."
      fi
    displayName: 'Expo prebuild iOS (si aplica)'

  # ============================================================
  # COCOAPODS
  # ============================================================
  - script: |
      set -euo pipefail

      cd ios

      echo "Versión de CocoaPods:"
      pod --version

      pod install
    displayName: 'Instalar CocoaPods'

  # ============================================================
  # LIMPIAR METADATOS MACOS DESPUÉS DE NPM Y POD INSTALL
  # ============================================================
  - script: |
      set -euo pipefail

      echo "Limpiando atributos extendidos de macOS..."

      if [ -d "$(Build.SourcesDirectory)/node_modules" ]; then
        echo "Limpiando node_modules..."
        xattr -cr "$(Build.SourcesDirectory)/node_modules" || true
      fi

      if [ -d "$(Build.SourcesDirectory)/ios/Pods" ]; then
        echo "Limpiando ios/Pods..."
        xattr -cr "$(Build.SourcesDirectory)/ios/Pods" || true
      fi

      echo "Limpiando proyecto completo..."
      xattr -cr "$(Build.SourcesDirectory)" || true

      echo "Eliminando archivos AppleDouble..."
      find "$(Build.SourcesDirectory)" -name "._*" -type f -delete || true

      echo "Revisando atributos extendidos residuales en frameworks React..."

      find "$(Build.SourcesDirectory)" \
        -path "*React.framework*" \
        -exec sh -c '
          echo "Framework: $1"
          xattr -lr "$1" 2>/dev/null || true
        ' sh {} \; || true

      echo "Limpieza de metadatos finalizada."
    displayName: 'Limpiar xattrs, resource forks y FinderInfo'

  # ============================================================
  # VERSIONADO IOS
  # ============================================================
  - script: |
      set -euo pipefail

      echo "Seteando versioning iOS..."
      echo "Marketing Version: $(IOS_MARKETING_VERSION)"
      echo "Build Number:      $(IOS_BUILD_NUMBER)"

      cd ios

      xcrun agvtool new-marketing-version "$(IOS_MARKETING_VERSION)" || true
      xcrun agvtool new-version -all "$(IOS_BUILD_NUMBER)" || true

      echo "Versionado completado."
    displayName: 'Set iOS Version + Build'

  # ============================================================
  # SECURE FILES
  # ============================================================
  - task: DownloadSecureFile@1
    name: iosCert
    displayName: 'Descargar certificado .p12'
    inputs:
      secureFile: 'dogcatify-ios.p12'

  - task: DownloadSecureFile@1
    name: iosProfile
    displayName: 'Descargar provisioning profile'
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'

  # ============================================================
  # KEYCHAIN + CERTIFICADO + PROVISIONING PROFILE
  # ============================================================
  - script: |
      set -euo pipefail

      CERT_PATH="$(iosCert.secureFilePath)"
      PROFILE_PATH="$(iosProfile.secureFilePath)"
      KEYCHAIN_PATH="$(KEYCHAIN_NAME)"

      echo "CERT_PATH=$CERT_PATH"
      echo "PROFILE_PATH=$PROFILE_PATH"
      echo "KEYCHAIN=$KEYCHAIN_PATH"

      security delete-keychain "$KEYCHAIN_PATH" || true

      security create-keychain \
        -p "$(MAC_KEYCHAIN_PASSWORD)" \
        "$KEYCHAIN_PATH"

      security set-keychain-settings \
        -lut 21600 \
        "$KEYCHAIN_PATH"

      security unlock-keychain \
        -p "$(MAC_KEYCHAIN_PASSWORD)" \
        "$KEYCHAIN_PATH"

      security list-keychains \
        -d user \
        -s "$KEYCHAIN_PATH" login.keychain-db

      security default-keychain \
        -s "$KEYCHAIN_PATH"

      echo "Importando certificado P12..."

      security import "$CERT_PATH" \
        -k "$KEYCHAIN_PATH" \
        -P "$(IOS_P12_PASSWORD)" \
        -A \
        -T /usr/bin/codesign \
        -T /usr/bin/security

      security set-key-partition-list \
        -S apple-tool:,apple:,codesign: \
        -s \
        -k "$(MAC_KEYCHAIN_PASSWORD)" \
        "$KEYCHAIN_PATH"

      echo "Identidades disponibles para codesign:"

      security find-identity \
        -v \
        -p codesigning \
        "$KEYCHAIN_PATH"

      UUID=$(
        /usr/bin/security cms -D -i "$PROFILE_PATH" |
        /usr/bin/plutil -extract UUID raw -o - -
      )

      NAME=$(
        /usr/bin/security cms -D -i "$PROFILE_PATH" |
        /usr/bin/plutil -extract Name raw -o - -
      )

      TEAM=$(
        /usr/bin/security cms -D -i "$PROFILE_PATH" |
        /usr/bin/plutil -extract TeamIdentifier.0 raw -o - -
      )

      APP_IDENTIFIER=$(
        /usr/bin/security cms -D -i "$PROFILE_PATH" |
        /usr/bin/plutil \
          -extract Entitlements.application-identifier \
          raw \
          -o - -
      )

      EXPIRATION=$(
        /usr/bin/security cms -D -i "$PROFILE_PATH" |
        /usr/bin/plutil \
          -extract ExpirationDate \
          raw \
          -o - -
      )

      echo "Profile Name:             $NAME"
      echo "Profile UUID:             $UUID"
      echo "Profile Team:             $TEAM"
      echo "Profile App Identifier:   $APP_IDENTIFIER"
      echo "Profile Expiration:       $EXPIRATION"

      if [ "$NAME" != "$(IOS_PROFILE_NAME)" ]; then
        echo "ERROR: el nombre del profile no coincide."
        echo "Esperado: $(IOS_PROFILE_NAME)"
        echo "Actual:   $NAME"
        exit 1
      fi

      if [ "$TEAM" != "$(IOS_TEAM_ID)" ]; then
        echo "ERROR: el Team ID del profile no coincide."
        echo "Esperado: $(IOS_TEAM_ID)"
        echo "Actual:   $TEAM"
        exit 1
      fi

      EXPECTED_IDENTIFIER="$(IOS_TEAM_ID).$(IOS_BUNDLE_ID)"

      if [ "$APP_IDENTIFIER" != "$EXPECTED_IDENTIFIER" ]; then
        echo "ERROR: el Bundle ID del profile no coincide."
        echo "Esperado: $EXPECTED_IDENTIFIER"
        echo "Actual:   $APP_IDENTIFIER"
        exit 1
      fi

      mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

      cp "$PROFILE_PATH" \
        "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      /usr/bin/security cms \
        -D \
        -i "$PROFILE_PATH" \
        > "$(Build.ArtifactStagingDirectory)/profile.plist"

      echo "Entitlements del profile:"

      /usr/bin/plutil \
        -p "$(Build.ArtifactStagingDirectory)/profile.plist" |
        sed -n '/"Entitlements" => {/,/}/p' |
        head -n 250 || true
    displayName: 'Keychain + importar certificado + instalar profile'
    env:
      IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)
      MAC_KEYCHAIN_PASSWORD: $(MAC_KEYCHAIN_PASSWORD)

  # ============================================================
  # VALIDAR ASSOCIATED DOMAINS
  # ============================================================
  - script: |
      set -euo pipefail

      echo "Validando Associated Domains..."

      if /usr/bin/plutil \
        -p "$(Build.ArtifactStagingDirectory)/profile.plist" |
        grep -q 'com.apple.developer.associated-domains'; then

        echo "OK: el profile incluye com.apple.developer.associated-domains"
      else
        echo "ERROR: el profile no incluye com.apple.developer.associated-domains"
        exit 1
      fi
    displayName: 'Check: Associated Domains en profile'

  # ============================================================
  # DETECTAR WORKSPACE
  # ============================================================
  - script: |
      set -euo pipefail

      WS=$(find ios -maxdepth 3 -name "*.xcworkspace" -print | head -n 1)

      if [ -z "$WS" ]; then
        echo "ERROR: no se encontró ningún .xcworkspace dentro de ios/"
        exit 1
      fi

      echo "Workspace encontrado: $WS"
      echo "##vso[task.setvariable variable=IOS_WORKSPACE]$WS"

      echo "Schemes disponibles:"
      xcodebuild -list -workspace "$WS"
    displayName: 'Detectar workspace + listar schemes'

  # ============================================================
  # DIAGNÓSTICO DE FIRMA
  # ============================================================
  - script: |
      set -euo pipefail

      SETTINGS_FILE="$(Build.ArtifactStagingDirectory)/build-settings-signing.txt"

      echo "Build settings relacionados con signing..."

      xcodebuild \
        -showBuildSettings \
        -workspace "$(IOS_WORKSPACE)" \
        -scheme "$(IOS_SCHEME)" \
        -configuration "$(IOS_CONFIGURATION)" \
        | egrep -i \
        "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN|PROVISIONING_PROFILE|ENTITLEMENTS|SIGNING|MARKETING_VERSION|CURRENT_PROJECT_VERSION" \
        | tee "$SETTINGS_FILE" || true

      ENT_PATH=$(
        xcodebuild \
          -showBuildSettings \
          -workspace "$(IOS_WORKSPACE)" \
          -scheme "$(IOS_SCHEME)" \
          -configuration "$(IOS_CONFIGURATION)" \
        | awk -F"= " '/CODE_SIGN_ENTITLEMENTS/ {print $2; exit}' \
        | xargs
      )

      echo "CODE_SIGN_ENTITLEMENTS=$ENT_PATH" |
        tee -a "$SETTINGS_FILE"

      if [ -n "$ENT_PATH" ]; then
        if [ -f "$ENT_PATH" ]; then
          echo "Contenido de entitlements del target:"

          cat "$ENT_PATH" |
            tee "$(Build.ArtifactStagingDirectory)/target-entitlements.entitlements"
        elif [ -f "$(Build.SourcesDirectory)/$ENT_PATH" ]; then
          echo "Contenido de entitlements del target:"

          cat "$(Build.SourcesDirectory)/$ENT_PATH" |
            tee "$(Build.ArtifactStagingDirectory)/target-entitlements.entitlements"
        else
          echo "El archivo de entitlements declarado no fue encontrado: $ENT_PATH"
        fi
      else
        echo "No existe un archivo de entitlements declarado."
      fi
    displayName: 'Diagnóstico: build settings + entitlements'

  # ============================================================
  # EXPORT OPTIONS
  # ============================================================
  - script: |
      set -euo pipefail

      EXPORT_PLIST="$(Build.SourcesDirectory)/ios/exportOptions.plist"

      cat > "$EXPORT_PLIST" <<EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>method</key>
        <string>$(IOS_EXPORT_METHOD)</string>

        <key>teamID</key>
        <string>$(IOS_TEAM_ID)</string>

        <key>signingStyle</key>
        <string>manual</string>

        <key>provisioningProfiles</key>
        <dict>
          <key>$(IOS_BUNDLE_ID)</key>
          <string>$(IOS_PROFILE_NAME)</string>
        </dict>

        <key>stripSwiftSymbols</key>
        <true/>

        <key>uploadSymbols</key>
        <true/>
      </dict>
      </plist>
      EOF

      echo "Export plist: $EXPORT_PLIST"

      plutil -lint "$EXPORT_PLIST"
      plutil -p "$EXPORT_PLIST"

      echo "##vso[task.setvariable variable=EXPORT_OPTIONS_PLIST]$EXPORT_PLIST"
    displayName: 'Crear exportOptions.plist'

  # ============================================================
  # ARCHIVE IOS
  # ============================================================
  - script: |
      set -euo pipefail

      ARCHIVE_PATH="$(Build.ArtifactStagingDirectory)/$(IOS_SCHEME).xcarchive"
      LOG_ARCHIVE="$(Build.ArtifactStagingDirectory)/xcodebuild-archive.log"
      DERIVED="$(Build.ArtifactStagingDirectory)/DerivedData"
      RESULT_BUNDLE="$(Build.ArtifactStagingDirectory)/ArchiveResult.xcresult"

      echo "Workspace: $(IOS_WORKSPACE)"
      echo "Scheme:    $(IOS_SCHEME)"
      echo "Config:    $(IOS_CONFIGURATION)"
      echo "Team:      $(IOS_TEAM_ID)"
      echo "BundleId:  $(IOS_BUNDLE_ID)"
      echo "Profile:   $(IOS_PROFILE_NAME)"
      echo "Archive:   $ARCHIVE_PATH"
      echo "Version:   $(IOS_MARKETING_VERSION)"
      echo "Build:     $(IOS_BUILD_NUMBER)"

      rm -rf "$DERIVED"
      rm -rf "$ARCHIVE_PATH"
      rm -rf "$RESULT_BUNDLE"
      rm -f "$LOG_ARCHIVE"

      mkdir -p "$DERIVED"

      echo "Limpieza preventiva antes del archive..."

      xattr -cr "$(Build.SourcesDirectory)" || true
      xattr -cr "$DERIVED" || true

      find "$(Build.SourcesDirectory)" \
        -name "._*" \
        -type f \
        -delete || true

      echo "Desbloqueando keychain..."

      security unlock-keychain \
        -p "$(MAC_KEYCHAIN_PASSWORD)" \
        "$(KEYCHAIN_NAME)"

      security set-keychain-settings \
        -lut 21600 \
        "$(KEYCHAIN_NAME)"

      security find-identity \
        -v \
        -p codesigning \
        "$(KEYCHAIN_NAME)"

      set +e

      xcodebuild \
        -workspace "$(IOS_WORKSPACE)" \
        -scheme "$(IOS_SCHEME)" \
        -configuration "$(IOS_CONFIGURATION)" \
        -sdk iphoneos \
        -destination "generic/platform=iOS" \
        -derivedDataPath "$DERIVED" \
        -archivePath "$ARCHIVE_PATH" \
        -resultBundlePath "$RESULT_BUNDLE" \
        -showBuildTimingSummary \
        CODE_SIGN_STYLE=Manual \
        DEVELOPMENT_TEAM="$(IOS_TEAM_ID)" \
        PRODUCT_BUNDLE_IDENTIFIER="$(IOS_BUNDLE_ID)" \
        PROVISIONING_PROFILE_SPECIFIER="$(IOS_PROFILE_NAME)" \
        CODE_SIGN_IDENTITY="Apple Distribution" \
        MARKETING_VERSION="$(IOS_MARKETING_VERSION)" \
        CURRENT_PROJECT_VERSION="$(IOS_BUILD_NUMBER)" \
        clean archive \
        2>&1 | tee "$LOG_ARCHIVE"

      RC=${PIPESTATUS[0]}

      set -e

      echo "=================================================="
      echo "Resultado xcodebuild: $RC"
      echo "=================================================="

      echo "=================================================="
      echo "Últimas 300 líneas del log"
      echo "=================================================="

      tail -n 300 "$LOG_ARCHIVE" || true

      echo "=================================================="
      echo "Errores relevantes encontrados"
      echo "=================================================="

      egrep -n -i \
        "error:|fatal error|ARCHIVE FAILED|Command CodeSign failed|Command PhaseScriptExecution failed|resource fork|Finder information|detritus|No profiles for|requires a provisioning profile|Provisioning profile.*doesn't|Provisioning profile.*does not|errSec|codesign.*failed|The following build commands failed|No signing certificate|Signing certificate.*not found|doesn't include signing certificate|doesn't match the entitlements" \
        "$LOG_ARCHIVE" \
        | tail -n 250 || true

      echo "=================================================="
      echo "Contexto alrededor de ARCHIVE FAILED"
      echo "=================================================="

      FAILED_LINE=$(
        grep -n -i "ARCHIVE FAILED" "$LOG_ARCHIVE" |
        tail -n 1 |
        cut -d: -f1 || true
      )

      if [ -n "$FAILED_LINE" ]; then
        START=$((FAILED_LINE - 150))

        if [ "$START" -lt 1 ]; then
          START=1
        fi

        END=$((FAILED_LINE + 40))

        sed -n "${START},${END}p" "$LOG_ARCHIVE"
      else
        echo "No se encontró la línea ARCHIVE FAILED."
      fi

      echo "=================================================="
      echo "Frameworks con atributos extendidos"
      echo "=================================================="

      if [ -d "$DERIVED" ]; then
        find "$DERIVED" \
          -name "*.framework" \
          -type d \
          -exec sh -c '
            ATTRS=$(xattr "$1" 2>/dev/null || true)
            if [ -n "$ATTRS" ]; then
              echo "Framework con xattrs: $1"
              xattr -lr "$1" 2>/dev/null || true
            fi
          ' sh {} \;
      fi

      if [ "$RC" -ne 0 ]; then
        echo "ERROR: el archive falló con código $RC"
        exit "$RC"
      fi

      if [ ! -d "$ARCHIVE_PATH" ]; then
        echo "ERROR: xcodebuild finalizó sin generar el xcarchive."
        exit 1
      fi

      echo "Archive generado correctamente:"
      ls -la "$ARCHIVE_PATH"
    displayName: 'Archive iOS (NATIVO)'
    env:
      MAC_KEYCHAIN_PASSWORD: $(MAC_KEYCHAIN_PASSWORD)

  # ============================================================
  # EXTRAER RESULTADO XCRESULT
  # ============================================================
  - script: |
      set -euo pipefail

      XR="$(Build.ArtifactStagingDirectory)/ArchiveResult.xcresult"
      JSON_OUT="$(Build.ArtifactStagingDirectory)/xcresult.json"

      if [ -d "$XR" ]; then
        echo "xcresult encontrado: $XR"

        xcrun xcresulttool get \
          --legacy \
          --path "$XR" \
          --format json \
          > "$JSON_OUT" || true

        if [ -f "$JSON_OUT" ]; then
          echo "Se generó xcresult.json"
          ls -lh "$JSON_OUT"
        fi
      else
        echo "No existe ArchiveResult.xcresult"
      fi
    displayName: 'Extraer xcresult'
    condition: succeededOrFailed()

  # ============================================================
  # PUBLICAR LOGS DE DIAGNÓSTICO
  # ============================================================
  - task: PublishBuildArtifacts@1
    displayName: 'Publicar logs de diagnóstico'
    condition: succeededOrFailed()
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'ios-diagnostics'
      publishLocation: 'Container'

  # ============================================================
  # EXPORTAR IPA
  # ============================================================
  - script: |
      set -euo pipefail

      ARCHIVE_PATH="$(Build.ArtifactStagingDirectory)/$(IOS_SCHEME).xcarchive"
      EXPORT_PATH="$(Build.ArtifactStagingDirectory)/export"
      LOG_EXPORT="$(Build.ArtifactStagingDirectory)/xcodebuild-export.log"

      if [ ! -d "$ARCHIVE_PATH" ]; then
        echo "ERROR: no existe el archive: $ARCHIVE_PATH"
        exit 1
      fi

      rm -rf "$EXPORT_PATH"
      rm -f "$LOG_EXPORT"

      mkdir -p "$EXPORT_PATH"

      echo "ExportOptionsPlist: $(EXPORT_OPTIONS_PLIST)"
      ls -la "$(EXPORT_OPTIONS_PLIST)"

      echo "Limpiando metadatos del archive antes del export..."

      xattr -cr "$ARCHIVE_PATH" || true

      find "$ARCHIVE_PATH" \
        -name "._*" \
        -type f \
        -delete || true

      security unlock-keychain \
        -p "$(MAC_KEYCHAIN_PASSWORD)" \
        "$(KEYCHAIN_NAME)"

      set +e

      xcodebuild \
        -exportArchive \
        -archivePath "$ARCHIVE_PATH" \
        -exportPath "$EXPORT_PATH" \
        -exportOptionsPlist "$(EXPORT_OPTIONS_PLIST)" \
        2>&1 | tee "$LOG_EXPORT"

      RC=${PIPESTATUS[0]}

      set -e

      echo "=================================================="
      echo "Resultado export: $RC"
      echo "=================================================="

      echo "=================================================="
      echo "Últimas 300 líneas del export"
      echo "=================================================="

      tail -n 300 "$LOG_EXPORT" || true

      echo "=================================================="
      echo "Errores relevantes del export"
      echo "=================================================="

      egrep -n -i \
        "error:|fatal error|EXPORT FAILED|exportArchive|No profiles for|requires a provisioning profile|Provisioning profile.*doesn't|Provisioning profile.*does not|errSec|codesign.*failed|No signing certificate|Signing certificate.*not found|The following build commands failed" \
        "$LOG_EXPORT" \
        | tail -n 250 || true

      if [ "$RC" -ne 0 ]; then
        echo "ERROR: el export falló con código $RC"
        exit "$RC"
      fi

      IPA_PATH=$(find "$EXPORT_PATH" -maxdepth 2 -name "*.ipa" -print | head -n 1)

      if [ -z "$IPA_PATH" ]; then
        echo "ERROR: el export terminó sin generar un IPA."
        exit 1
      fi

      echo "IPA generado:"
      ls -lh "$IPA_PATH"
    displayName: 'Export IPA'
    env:
      MAC_KEYCHAIN_PASSWORD: $(MAC_KEYCHAIN_PASSWORD)

  # ============================================================
  # PUBLICAR IPA
  # ============================================================
  - task: PublishBuildArtifacts@1
    displayName: 'Publicar artefacto iOS'
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)/export'
      artifactName: 'ios-ipa'
      publishLocation: 'Container'