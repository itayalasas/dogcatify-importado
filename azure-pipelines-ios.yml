trigger:
  branches:
    include:
      - main
      - dev

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing

  - name: NODE_VERSION
    value: '18.x'

  # Deben coincidir con Xcode
  - name: IOS_WORKSPACE
    value: 'DogCatiFy.xcworkspace'   # <-- si tu workspace real es dogcatify.xcworkspace, cámbialo

  - name: IOS_SCHEME
    value: 'DogCatiFy'               # <-- tu scheme (según tu screenshot)

  # Nombre EXACTO del provisioning profile (Name del .mobileprovision)
  - name: EXPORT_PROFILE_NAME
    value: 'DogCatiFy_AppStore'

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Instalar Node.js'

  - script: |
      set -e
      node -v
      npm -v
    displayName: 'Ver versiones'

  - script: |
      set -e
      npm ci
    displayName: 'Instalar dependencias (npm ci)'

  # Si tu repo YA tiene carpeta ios/ commiteada, podés borrar este paso.
  - script: |
      set -e
      npx expo --version
      npx expo prebuild --platform ios --non-interactive
    displayName: 'Expo prebuild iOS'

  - script: |
      set -e
      cd ios
      pod --version
      pod install --repo-update
    displayName: 'Instalar CocoaPods'

  # Secure files (Library > Secure files)
  - task: DownloadSecureFile@1
    name: iosCert
    inputs:
      secureFile: 'dogcatify-ios.p12'
    displayName: 'Descargar .p12'

  - task: DownloadSecureFile@1
    name: iosProfile
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'
    displayName: 'Descargar provisioning profile'

  # Keychain + importar p12 + instalar .mobileprovision (robusto)
  - script: |
      set -euo pipefail

      CERT_PATH="$(iosCert.secureFilePath)"
      PROFILE_PATH="$(iosProfile.secureFilePath)"

      echo "CERT_PATH=$CERT_PATH"
      echo "PROFILE_PATH=$PROFILE_PATH"

      KEYCHAIN_NAME="build.keychain"
      KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME-db"

      # Si existía de otra corrida, lo borramos para evitar “already exists”
      if security list-keychains | grep -q "$KEYCHAIN_NAME"; then
        echo "El keychain $KEYCHAIN_NAME ya existe -> lo elimino"
        security delete-keychain "$KEYCHAIN_NAME" || true
      fi

      echo "Creando keychain..."
      security create-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

      # Mantenerlo desbloqueado durante la build (6 horas)
      security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
      security unlock-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

      # Asegurar que el sistema lo vea en el search list
      security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain-db
      security default-keychain -s "$KEYCHAIN_NAME"

      echo "Importando .p12..."
      security import "$CERT_PATH" -k "$KEYCHAIN_NAME" -P "$IOS_P12_PASSWORD" -A

      # Permisos para codesign (evita prompts)
      security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

      echo "Instalando provisioning profile..."
      mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

      # Convertimos a plist en archivo y extraemos UUID de forma estable
      security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
      UUID=$(/usr/bin/plutil -extract UUID raw -o - /tmp/profile.plist)

      if [ -z "$UUID" ]; then
        echo "ERROR: No pude extraer UUID del provisioning profile."
        exit 1
      fi

      cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
      echo "Provisioning instalado como: $UUID.mobileprovision"

      echo "Identidades disponibles:"
      security find-identity -v -p codesigning "$KEYCHAIN_NAME" || true

    displayName: 'Keychain + importar .p12 + instalar .mobileprovision'
    env:
      IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)
      MAC_KEYCHAIN_PASSWORD: $(MAC_KEYCHAIN_PASSWORD)

  # Crear exportOptions.plist (sin romper el YAML)
  - script: |
      set -euo pipefail

      cat > ios/exportOptions.plist <<EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>method</key>
        <string>$(IOS_EXPORT_METHOD)</string>

        <key>teamID</key>
        <string>$(IOS_TEAM_ID)</string>

        <key>signingStyle</key>
        <string>manual</string>

        <key>provisioningProfiles</key>
        <dict>
          <key>$(IOS_BUNDLE_ID)</key>
          <string>$(EXPORT_PROFILE_NAME)</string>
        </dict>
      </dict>
      </plist>
      EOF

      echo "exportOptions.plist creado:"
      cat ios/exportOptions.plist
    displayName: 'Crear exportOptions.plist'

  # (Opcional) listar schemes para verificar nombre exacto
  - script: |
      set -e
      cd ios
      xcodebuild -list -workspace "$(IOS_WORKSPACE)"
    displayName: 'Listar schemes del workspace'

  - script: |
      set -euo pipefail
      cd ios

      ARCHIVE_PATH="$PWD/build/$(IOS_SCHEME).xcarchive"
      EXPORT_PATH="$PWD/build/export"

      # Limpieza
      rm -rf "$PWD/build" || true

      echo "Archivando..."
      xcodebuild \
        -workspace "$(IOS_WORKSPACE)" \
        -scheme "$(IOS_SCHEME)" \
        -configuration Release \
        -sdk iphoneos \
        -destination "generic/platform=iOS" \
        -archivePath "$ARCHIVE_PATH" \
        CODE_SIGN_STYLE=Manual \
        DEVELOPMENT_TEAM="$(IOS_TEAM_ID)" \
        PRODUCT_BUNDLE_IDENTIFIER="$(IOS_BUNDLE_ID)" \
        PROVISIONING_PROFILE_SPECIFIER="$(EXPORT_PROFILE_NAME)" \
        archive

      echo "Exportando .ipa..."
      xcodebuild \
        -exportArchive \
        -archivePath "$ARCHIVE_PATH" \
        -exportPath "$EXPORT_PATH" \
        -exportOptionsPlist "$PWD/exportOptions.plist"

      echo "Export final:"
      ls -la "$EXPORT_PATH"
    displayName: 'Compilar y exportar .ipa'

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: 'ios/build/export'
      artifactName: 'ios-app'
      publishLocation: 'Container'
    displayName: 'Publicar artefacto iOS'
