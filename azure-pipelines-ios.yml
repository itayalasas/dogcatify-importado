trigger:
  - main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals dogcatify-mac

variables:
  - group: ios-signing

  - name: NODE_VERSION
    value: '18.x'

  - name: IOS_SCHEME
    value: 'DogCatiFy'

  - name: IOS_WORKSPACE
    value: 'ios/DogCatiFy.xcworkspace'

  - name: IOS_CONFIGURATION
    value: 'Release'

  - name: KEYCHAIN_NAME
    value: 'build.keychain'

  # Nombre EXACTO del provisioning profile (como aparece en Apple Developer)
  # (En tu inspección sale: Name = "DogCatiFy_AppStore")
  - name: IOS_PROFILE_NAME
    value: 'DogCatiFy_AppStore'

steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: NodeTool@0
    displayName: 'Instalar Node.js'
    inputs:
      versionSpec: '$(NODE_VERSION)'

  - script: |
      set -euo pipefail
      node -v
      npm -v
    displayName: 'Ver versiones Node/NPM'

  - script: |
      set -euo pipefail
      npm ci
    displayName: 'Instalar dependencias (npm ci)'

  # Expo prebuild solo si NO existe ios/
  - script: |
      set -euo pipefail
      if [ ! -d "ios" ]; then
        echo "No existe carpeta ios/, ejecutando prebuild..."
        npx expo prebuild -p ios --no-install
      else
        echo "Existe carpeta ios/, saltando expo prebuild."
      fi
    displayName: 'Expo prebuild iOS (si aplica)'

  - script: |
      set -euo pipefail
      cd ios
      pod install
    displayName: 'Instalar CocoaPods'

  - task: DownloadSecureFile@1
    name: iosCert
    displayName: 'Descargar .p12'
    inputs:
      secureFile: 'dogcatify-ios.p12'

  - task: DownloadSecureFile@1
    name: iosProfile
    displayName: 'Descargar provisioning profile'
    inputs:
      secureFile: 'DogCatiFy_AppStore.mobileprovision'

  # Keychain + importar .p12 + instalar provisioning
  - script: |
      set -euo pipefail

      CERT_PATH="$(iosCert.secureFilePath)"
      PROFILE_PATH="$(iosProfile.secureFilePath)"

      echo "CERT_PATH=$CERT_PATH"
      echo "PROFILE_PATH=$PROFILE_PATH"
      ls -la "$CERT_PATH" "$PROFILE_PATH"

      # 1) Reset keychain (evita "already exists" y password mismatch)
      security delete-keychain "$(KEYCHAIN_NAME)" || true

      security create-keychain -p "$(MAC_KEYCHAIN_PASSWORD)" "$(KEYCHAIN_NAME)"
      security set-keychain-settings -t 3600 -l "$(KEYCHAIN_NAME)"
      security unlock-keychain -p "$(MAC_KEYCHAIN_PASSWORD)" "$(KEYCHAIN_NAME)"

      # Lista de búsqueda y default keychain
      security list-keychains -d user -s "$(KEYCHAIN_NAME)" login.keychain-db
      security default-keychain -s "$(KEYCHAIN_NAME)"

      # 2) Importar certificado
      security import "$CERT_PATH" -k "$(KEYCHAIN_NAME)" -P "$(IOS_P12_PASSWORD)" -A -T /usr/bin/codesign -T /usr/bin/security
      security set-key-partition-list -S apple-tool:,apple: -s -k "$(MAC_KEYCHAIN_PASSWORD)" "$(KEYCHAIN_NAME)"

      echo "Certificados en keychain:"
      security find-identity -v -p codesigning "$(KEYCHAIN_NAME)" || true

      # 3) Instalar provisioning profile por UUID
      UUID=$(/usr/bin/security cms -D -i "$PROFILE_PATH" | /usr/bin/plutil -extract UUID raw -o - -)
      NAME=$(/usr/bin/security cms -D -i "$PROFILE_PATH" | /usr/bin/plutil -extract Name raw -o - -)
      APPID=$(/usr/bin/security cms -D -i "$PROFILE_PATH" | /usr/bin/plutil -extract Entitlements.application-identifier raw -o - -)

      echo "Provisioning Name: $NAME"
      echo "Provisioning UUID: $UUID"
      echo "Provisioning AppID: $APPID"

      mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
      cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
      ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      echo "OK: keychain + p12 + provisioning instalados"
    displayName: 'Keychain + importar .p12 + instalar .mobileprovision'
    env:
      IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)
      MAC_KEYCHAIN_PASSWORD: $(MAC_KEYCHAIN_PASSWORD)

  - script: |
      set -euo pipefail
      xcodebuild -list -workspace "$(IOS_WORKSPACE)"
    displayName: 'Listar schemes del workspace'

  # exportOptions.plist (NO rompe YAML)
  - script: |
      set -euo pipefail
      cat > ios/exportOptions.plist <<EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>method</key>
        <string>$(IOS_EXPORT_METHOD)</string>

        <key>teamID</key>
        <string>$(IOS_TEAM_ID)</string>

        <key>signingStyle</key>
        <string>manual</string>

        <key>provisioningProfiles</key>
        <dict>
          <key>$(IOS_BUNDLE_ID)</key>
          <string>$(IOS_PROFILE_NAME)</string>
        </dict>
      </dict>
      </plist>
      EOF

      echo "exportOptions.plist generado:"
      cat ios/exportOptions.plist
    displayName: 'Crear exportOptions.plist'

  # ARCHIVE + EXPORT IPA (con override de signing)
  - script: |
      set -euo pipefail

      ARCHIVE_PATH="$(Build.ArtifactStagingDirectory)/$(IOS_SCHEME).xcarchive"
      EXPORT_PATH="$(Build.ArtifactStagingDirectory)/export"

      echo "Archive: $ARCHIVE_PATH"
      echo "Export:  $EXPORT_PATH"

      # IMPORTANTÍSIMO: forzar signing manual para evitar que Xcode intente "Automatic"
      # y para que use Team + Profile correcto.
      xcodebuild \
        -workspace "$(IOS_WORKSPACE)" \
        -scheme "$(IOS_SCHEME)" \
        -configuration "$(IOS_CONFIGURATION)" \
        -sdk iphoneos \
        -destination "generic/platform=iOS" \
        -archivePath "$ARCHIVE_PATH" \
        CODE_SIGN_STYLE=Manual \
        DEVELOPMENT_TEAM="$(IOS_TEAM_ID)" \
        PRODUCT_BUNDLE_IDENTIFIER="$(IOS_BUNDLE_ID)" \
        PROVISIONING_PROFILE_SPECIFIER="$(IOS_PROFILE_NAME)" \
        OTHER_CODE_SIGN_FLAGS="--keychain $(KEYCHAIN_NAME)" \
        clean archive | tee "$(Build.ArtifactStagingDirectory)/xcodebuild-archive.log"

      xcodebuild \
        -exportArchive \
        -archivePath "$ARCHIVE_PATH" \
        -exportPath "$EXPORT_PATH" \
        -exportOptionsPlist "ios/exportOptions.plist" | tee "$(Build.ArtifactStagingDirectory)/xcodebuild-export.log"

      echo "Contenido export:"
      ls -la "$EXPORT_PATH"
    displayName: 'Compilar y exportar .ipa'

  - task: PublishBuildArtifacts@1
    displayName: 'Publicar artefacto iOS'
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)/export'
      artifactName: 'ios-ipa'
      publishLocation: 'Container'
